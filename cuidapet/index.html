<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CuidaPet - Carteira de saúde, lembretes e loja para o seu pet</title>
  <meta name="description" content="Crie seu perfil, cadastre todos os seus pets e acompanhe vacinas, consultas, lembretes e compras em um só lugar. No computador e no celular.">
  <meta name="theme-color" content="#0284c7">
  <link rel="preload" as="image" href="assets/img/hero.jpg">
  <style>
    #startupSplash{position:fixed;inset:0 auto 0 0;width:100vw;z-index:99999;background:#0284c7 url('assets/img/hero.jpg') 30% center/cover no-repeat;transition:width 1.8s cubic-bezier(.65,0,.25,1),transform 1.8s cubic-bezier(.65,0,.25,1),padding 1.8s cubic-bezier(.65,0,.25,1);will-change:width,transform}
    #startupBrand{position:fixed;z-index:100001;left:50%;top:50%;transform:translate(-50%,-50%);color:white;font:700 3.4rem Fredoka,'Trebuchet MS',sans-serif;text-shadow:0 4px 18px rgba(0,0,0,.2);transition:left 1.8s cubic-bezier(.65,0,.25,1),top 1.8s cubic-bezier(.65,0,.25,1),transform 1.8s cubic-bezier(.65,0,.25,1),font-size 1.8s cubic-bezier(.65,0,.25,1)}
    #startupSplash.done{pointer-events:none}
    @media(min-width:900px){#startupSplash.done{width:264px}#startupBrand.docked{left:28px;top:26px;transform:none;font-size:2.3rem}body.startup-sidebar-ready .sidebar{position:relative;z-index:100000}body.startup-revealing .sidebar .side-logo{visibility:hidden}body.startup-revealing .sidebar>*{animation:sidebarRise .55s cubic-bezier(.2,.75,.25,1) both}body.startup-revealing .sidebar>.side-logo{animation:none}body.startup-revealing .sidebar>.side-nav{animation-delay:1.12s}body.startup-revealing .sidebar>.side-pets{animation-delay:1.24s}body.startup-revealing .sidebar>.side-user{animation-delay:1.34s}body.startup-revealing .side-nav button{animation:sidebarRise .42s cubic-bezier(.2,.75,.25,1) both}body.startup-revealing .side-nav button:nth-child(1){animation-delay:1.12s}body.startup-revealing .side-nav button:nth-child(2){animation-delay:1.18s}body.startup-revealing .side-nav button:nth-child(3){animation-delay:1.24s}body.startup-revealing .side-nav button:nth-child(4){animation-delay:1.3s}body.startup-revealing .side-nav button:nth-child(5){animation-delay:1.36s}body.startup-revealing .side-nav button:nth-child(6){animation-delay:1.42s}body.startup-revealing .side-nav button:nth-child(7){animation-delay:1.48s}body.startup-revealing .side-nav button:nth-child(8){animation-delay:1.54s}}
    @media(max-width:899px){#startupSplash.done{transform:translateY(-100%)}#startupBrand.docked{top:-150vh;transform:translate(-50%,-50%)}}
    @keyframes sidebarRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @media(prefers-reduced-motion:reduce){#startupSplash,#startupBrand{transition:none}body.startup-revealing .sidebar>* ,body.startup-revealing .side-nav button{animation:none!important}}
  </style>

  <!-- App instalável -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CuidaPet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <div id="startupSplash" aria-hidden="true"></div>
  <span id="startupBrand" role="status" aria-label="CuidaPet">CuidaPet</span>
  <div class="shell" id="device">
    <!-- Menu lateral (computador) -->
    <aside class="sidebar" id="sidebar" aria-label="Menu principal"></aside>

    <div class="main">
      <!-- Barra superior (computador) -->
      <header class="desk-top" id="deskTop"></header>

      <main class="screen" id="screen" tabindex="-1"></main>

      <!-- Abas inferiores (celular) -->
      <nav class="tabbar" id="tabbar" aria-label="Navegação principal"></nav>
    </div>

    <div class="sheet-backdrop" id="sheetBackdrop"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <clipPath id="appHeroMask" clipPathUnits="objectBoundingBox">
        <path d="M 0 0 L 1 0 L 1 0.86 L 0.96 0.86
                 C 0.89 0.86, 0.89 0.93, 0.85 0.965
                 C 0.82 0.99, 0.79 1, 0.74 1
                 L 0.26 1
                 C 0.21 1, 0.18 0.99, 0.15 0.965
                 C 0.11 0.93, 0.11 0.86, 0.04 0.86
                 L 0 0.86 Z" />
      </clipPath>
      <clipPath id="heroCardMask" clipPathUnits="objectBoundingBox">
        <path d="M 0 0 L 1 0 L 1 0.85 L 0.73 0.85 C 0.69 0.85, 0.665 0.89, 0.66 0.94 C 0.655 0.98, 0.63 0.99, 0.60 0.99
                 L 0.40 0.99 C 0.37 0.99, 0.345 0.98, 0.34 0.94 C 0.335 0.89, 0.31 0.85, 0.27 0.85 L 0 0.85 Z" />
      </clipPath>
    </defs>
  </svg>

  <!-- Protótipo de portfólio: sem login e sem banco de dados. O calendário de vacinas vem de assets/data/vacinas.json. -->
  <script>window.CP_IMG_BASE = 'assets/img/';</script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
